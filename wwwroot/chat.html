<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edf0f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13161d" media="(prefers-color-scheme: dark)">
  <title>Нова розмова</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffc21a' d='M12 5h8a10 10 0 0 1 10 10v9a3 3 0 0 1-3 3H12A10 10 0 0 1 2 17v-2A10 10 0 0 1 12 5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400..700&family=Literata:opsz,wght@7..72,400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="chat.js" defer></script>
</head>
<body class="chat-page">
  <!-- Згорнуту панель ставимо ще до першого малювання, щоб вона не блимала при завантаженні -->
  <script>try { if (localStorage.getItem('drawer') === 'closed') document.body.classList.add('drawer-closed'); } catch {}</script>
  <div class="app">
    <!-- Висувна панель з розмовами -->
    <aside class="drawer" id="drawer" aria-label="Розмови">
      <button class="new-chat" id="newChat" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-4 1 1-4Z"/></svg>
        Нова розмова
      </button>
      <nav class="chat-list" id="chatList" aria-label="Збережені розмови"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleDrawer" type="button" aria-label="Розмови" aria-controls="drawer" aria-expanded="false">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <h1 class="chat-title" id="chatTitle">Нова розмова</h1>
        <button class="icon-btn" id="newChatTop" type="button" aria-label="Нова розмова">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-4 1 1-4Z"/></svg>
        </button>
      </header>

      <section class="messages" id="messages" role="log" aria-label="Повідомлення"></section>

      <form class="composer" id="composer">
        <div class="composer-box">
          <div class="previews" id="previews" hidden></div>
          <div class="composer-row">
            <button class="icon-btn" id="attach" type="button" aria-label="Додати фото">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><path d="M16 5h6M19 2v6"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            </button>
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
            <textarea id="input" rows="1" placeholder="Напишіть повідомлення" aria-label="Повідомлення"></textarea>
            <button class="send" id="send" type="submit" aria-label="Надіслати" disabled>
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </form>

      <div class="dropzone" id="dropzone" hidden>Відпустіть, щоб додати фото</div>
    </main>
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Перегляд фото">
    <img alt="">
    <button class="icon-btn lightbox-close" type="button" aria-label="Закрити">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
