<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edf0f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13161d" media="(prefers-color-scheme: dark)">
  <title>Вхід — Mechs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffc21a' d='M12 5h8a10 10 0 0 1 10 10v9a3 3 0 0 1-3 3H12A10 10 0 0 1 2 17v-2A10 10 0 0 1 12 5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400..700&family=Literata:opsz,wght@7..72,500..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
  <script src="app.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="site">
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./" aria-label="Mechs — на головну">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 5h8a10 10 0 0 1 10 10v9a3 3 0 0 1-3 3H12A10 10 0 0 1 2 17v-2A10 10 0 0 1 12 5z"/></svg>
        Mechs
      </a>
      <nav class="site-nav" aria-label="Розділи">
        <a href="./">Майстри</a>
        <a href="chat.html">AI-помічник</a>
      </nav>
      <div class="auth" id="auth"></div>
    </div>
  </header>

  <main class="wrap auth-page">
    <section class="auth-card">
      <div class="tabs" role="tablist" aria-label="Вхід або реєстрація">
        <button class="tab" id="tabLogin" type="button" role="tab" aria-controls="loginForm" aria-selected="true">Вхід</button>
        <button class="tab" id="tabRegister" type="button" role="tab" aria-controls="registerForm" aria-selected="false">Реєстрація</button>
      </div>

      <form class="stack" id="loginForm" role="tabpanel" aria-labelledby="tabLogin">
        <h1>Вхід</h1>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Увійти</button>
        <p class="muted small">Немає акаунта? <a href="?mode=register" data-switch="register">Зареєструйтеся</a></p>
      </form>

      <form class="stack" id="registerForm" role="tabpanel" aria-labelledby="tabRegister" hidden>
        <h1>Реєстрація</h1>
        <fieldset class="role-pick">
          <legend>Хто ви?</legend>
          <label class="role-option">
            <input type="radio" name="role" value="client" checked>
            <span><strong>Клієнт</strong><span class="muted">Шукаю майстра і записуюсь</span></span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="master">
            <span><strong>Майстер</strong><span class="muted">Приймаю записи, веду розклад</span></span>
          </label>
        </fieldset>
        <div class="field">
          <label for="regName">Ім'я</label>
          <input id="regName" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required>
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input id="regEmail" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="regPhone">Телефон <span class="muted">(необов’язково)</span></label>
          <input id="regPhone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="+380 67 123 45 67">
        </div>
        <div class="field">
          <label for="regPassword">Пароль</label>
          <input id="regPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="passwordHint">
          <span class="muted small" id="passwordHint">Щонайменше 8 символів</span>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Створити акаунт</button>
        <p class="muted small">Уже є акаунт? <a href="?" data-switch="login">Увійдіть</a></p>
      </form>
    </section>
  </main>
</body>
</html>
